<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b04e69">
<title>สต็อกของใช้สำนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fcf8f8; --card:#ffffff; --ink:#3a2f35; --mut:#85787e; --line:#f0e4e7;
  --rose:#b04e69; --rose-d:#963f58; --rose-t:#f8e7ec;
  --sage:#4d8a6f; --sage-t:#e6f1ec; --amber:#a86a0a; --amber-t:#fbf0dc; --red:#b3392f;
  --r:16px; --shadow:0 1px 2px rgba(80,40,55,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1619; --card:#262024; --ink:#f3e9ed; --mut:#aa9ca3; --line:#38303a;
  --rose:#e08aa1; --rose-d:#eba3b6; --rose-t:#3a2630; --sage:#7cc0a1; --sage-t:#1f3029; --amber:#e3b25a; --amber-t:#38301d; --red:#ff8d84;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Sarabun,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,.num,button,nav{font-family:Prompt,Sarabun,sans-serif}
h1{font-size:24px;font-weight:500;margin:0 0 4px}
h2{font-size:18px;font-weight:500;margin:28px 0 10px}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.sub{color:var(--mut);font-size:15px}
.hide{display:none!important}

/* top bar + nav */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:720px;margin:0 auto}
.brand{font:500 18px Prompt;color:var(--rose)}
.who{font-size:14px;color:var(--mut);text-align:right;line-height:1.3}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;max-width:120px;display:grid;justify-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:12.5px;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--rose);background:var(--rose-t)}
@media(min-width:820px){
  body{padding-bottom:40px}
  nav{position:static;border:0;background:none;max-width:720px;margin:0 auto 6px;padding:0 18px;justify-content:flex-start;gap:6px}
  nav button{flex:none;display:flex;gap:8px;align-items:center;font-size:15px;padding:9px 16px;max-width:none}
  nav button svg{width:20px;height:20px}
}

/* cards & rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--mut)}
.num{font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:500 12.5px Prompt;padding:2px 10px;border-radius:99px;background:var(--rose-t);color:var(--rose)}
.pill.ok{background:var(--sage-t);color:var(--sage)} .pill.warn{background:var(--amber-t);color:var(--amber)}
.empty{text-align:center;color:var(--mut);padding:28px 8px}

/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.tile{border:0;border-radius:20px;padding:20px 16px;text-align:left;cursor:pointer;display:grid;gap:10px;font:inherit;min-height:128px;align-content:space-between}
.tile svg{width:34px;height:34px}
.tile b{font:500 20px Prompt;display:block}
.tile span{font-size:14px;opacity:.85}
.tile.out{background:var(--rose);color:#fff}
.tile.in{background:var(--sage-t);color:var(--sage)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fact{padding:14px 16px}.fact .num{font-size:28px;line-height:1.1;display:block}.fact span{font-size:14px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bars i{display:block;border-radius:4px}

/* forms */
label{display:grid;gap:6px;font-size:14.5px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-height:48px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose);outline-offset:1px;border-color:transparent}
button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.btn{font:500 17px Prompt;border:0;border-radius:14px;background:var(--rose);color:#fff;padding:14px 20px;min-height:52px;cursor:pointer;width:100%}
.btn:hover{background:var(--rose-d)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.soft{background:var(--rose-t);color:var(--rose)} .btn.ghost{background:none;color:var(--mut);border:1.5px solid var(--line)}
.btn.sm{width:auto;min-height:40px;padding:8px 16px;font-size:15px}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search{position:relative}.search svg{position:absolute;left:14px;top:14px;width:20px;color:var(--mut)}.search input{padding-left:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 16px;font:15px Sarabun;cursor:pointer;min-height:40px}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer;min-height:56px}
.pick:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--rose);font:500 20px Prompt;cursor:pointer}
.stepper input{width:64px;text-align:center;padding:8px 4px;min-height:40px}
.x{border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;padding:6px 10px;border-radius:10px}
.err{color:var(--red);font-size:14px}
.note{padding:12px 14px;border-radius:12px;font-size:15px}.note.ok{background:var(--sage-t);color:var(--sage)}.note.bad{background:#f7dedb;color:var(--red)}
@media(prefers-color-scheme:dark){.note.bad{background:#3d2220}}
.done{text-align:center;padding:30px 10px}.done svg{width:60px;height:60px;color:var(--sage)}
.done h1{margin-top:10px}

/* sheet + toast */
#sheetBg{position:fixed;inset:0;background:rgba(40,20,30,.4);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 18px 28px;z-index:41;display:none;max-width:720px;margin:0 auto}
#sheet .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:6px auto 14px}
@media(prefers-reduced-motion:no-preference){#sheet.open{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:15px;z-index:60;display:none;max-width:90vw}


/* key metrics */
.score{display:flex;align-items:center;gap:20px;border-radius:20px;padding:18px 20px;background:linear-gradient(135deg,var(--rose-t),var(--card) 70%);border:1px solid var(--line)}
.ring{position:relative;width:116px;height:116px;flex:none}.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font:600 32px/1 Prompt}.ring span{font-size:12px;color:var(--mut)}
.score h3{font:500 20px Prompt;margin:2px 0 6px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.meter{padding:12px 14px}.meter .top{display:flex;flex-direction:column;gap:0;font-size:14px;color:var(--mut)}.meter .top span{order:1}.meter b{order:0;font:500 26px/1.2 Prompt}
.track{height:7px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}.track i{display:block;height:100%;border-radius:99px}
.todo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 16px;min-height:60px}
.todo .t{font-weight:500}.todo .go{font:500 14px Prompt;color:var(--c);border:1.5px solid var(--c);border-radius:10px;padding:5px 14px;flex:none}
.foot{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--mut);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:18px}
.lcard{width:100%;max-width:900px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:14px;display:grid;box-shadow:0 14px 44px rgba(176,78,105,.12)}
.lart{display:none;background:var(--rose-t);border-radius:20px;padding:22px 20px;flex-direction:column;min-height:460px}
.lart{overflow:hidden}.lart svg{flex:1;min-height:0;width:100%;overflow:visible}
.lbrand,.lbrand-m{font:600 18px Prompt;color:var(--rose)}
.lbrand-m{margin-bottom:14px}
.lcap{text-align:center;color:var(--rose-d);font:500 16px/1.5 Prompt}
.lform{padding:22px 18px 18px;display:grid;align-content:center}
.lform h1{text-align:center;font:500 28px Prompt;margin:0 0 22px}
.field{position:relative}.field .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mut);pointer-events:none}
.field input{padding-left:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mut);cursor:pointer;border-radius:10px;display:grid;place-items:center}
.eye svg{width:20px;height:20px}
.forgot{text-align:right;margin-top:-6px}.forgot button,.sw button{border:0;background:none;color:var(--rose);font:500 15px Sarabun;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.sw{text-align:center;color:var(--mut);font-size:15px;margin:18px 0 0}
@media(min-width:760px){.lcard{grid-template-columns:1fr 1fr}.lart{display:flex}.lbrand-m{display:none}.lform{padding:26px 34px}}
</style>
</head>
<body>

<div id="login" class="hide">
  <div class="lcard">
    <aside class="lart" aria-hidden="true">
      <div class="lbrand">สต็อกของใช้สำนักงาน</div>
      <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
        <circle cx="330" cy="60" r="90" fill="#fff" opacity=".4"/><circle cx="40" cy="380" r="110" fill="#fff" opacity=".35"/>
        <g fill="#c97b90"><rect x="40" y="136" width="320" height="10" rx="5"/><rect x="40" y="246" width="320" height="10" rx="5"/><rect x="40" y="356" width="320" height="10" rx="5"/>
          <rect x="46" y="70" width="9" height="296" rx="4"/><rect x="345" y="70" width="9" height="296" rx="4"/></g>
        <g><rect x="70" y="90" width="72" height="46" rx="6" fill="#f3c6d1"/><rect x="100" y="90" width="12" height="46" fill="#e6a9ba"/>
          <rect x="152" y="104" width="56" height="32" rx="6" fill="#cfe6db"/><rect x="222" y="78" width="82" height="58" rx="6" fill="#f9dde4"/><rect x="254" y="78" width="12" height="58" fill="#efc3cf"/>
          <rect x="70" y="190" width="92" height="56" rx="6" fill="#e9b0c0"/><rect x="108" y="190" width="12" height="56" fill="#d995aa"/>
          <rect x="174" y="204" width="62" height="42" rx="6" fill="#fff"/><rect x="250" y="184" width="92" height="62" rx="6" fill="#f3c6d1"/><rect x="288" y="184" width="12" height="62" fill="#e6a9ba"/>
          <rect x="70" y="298" width="62" height="58" rx="6" fill="#cfe6db"/><rect x="146" y="314" width="86" height="42" rx="6" fill="#f9dde4"/><rect x="246" y="294" width="86" height="62" rx="6" fill="#e9b0c0"/><rect x="284" y="294" width="12" height="62" fill="#d995aa"/></g>
        <g transform="translate(214 8)"><rect width="128" height="60" rx="14" fill="#fff"/><circle cx="24" cy="21" r="7" fill="#4d8a6f"/><rect x="42" y="17" width="64" height="8" rx="4" fill="#ead9de"/><circle cx="24" cy="42" r="7" fill="#b04e69"/><rect x="42" y="38" width="44" height="8" rx="4" fill="#ead9de"/></g>
      </svg>
      <p class="lcap">เบิก รับเข้า และนับสต็อก<br>ได้ง่าย ๆ ในที่เดียว</p>
    </aside>
    <section class="lform">
      <div id="formBox">
        <div class="lbrand-m">สต็อกของใช้สำนักงาน</div>
        <h1 id="lTitle">เข้าสู่ระบบ</h1>
        <div class="form">
          <label id="nameBox" class="hide">ชื่อที่แสดง<div class="field"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><input id="nm" autocomplete="name" placeholder="เช่น สมชาย"></div></label>
          <label>อีเมล<div class="field"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg><input id="em" type="email" autocomplete="username" inputmode="email" placeholder="you@email.com"></div></label>
          <label>รหัสผ่าน<div class="field"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="pw" type="password" autocomplete="current-password" placeholder="อย่างน้อย 6 ตัวอักษร"><button type="button" class="eye" id="eye" aria-label="แสดงรหัสผ่าน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></label>
          <div class="forgot"><button type="button" id="forgot">ลืมรหัสผ่าน?</button></div>
          <button class="btn" id="go">เข้าสู่ระบบ</button>
          <div id="loginMsg"></div>
        </div>
        <p class="sw"><span id="swText">ยังไม่มีบัญชี?</span> <button type="button" id="swBtn">สมัครใช้งาน</button></p>
      </div>
      <div id="recBox" class="hide">
        <h1>ตั้งรหัสผ่านใหม่</h1>
        <div class="form"><label>รหัสผ่านใหม่<div class="field"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="rp" type="password" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร"></div></label>
          <button class="btn" id="recGo">บันทึกรหัสผ่านใหม่</button><div id="recMsg"></div></div>
      </div>
    </section>
  </div>
</div>

<div id="app" class="hide">
  <div class="top"><div class="brand">สต็อกของใช้สำนักงาน</div><div class="who" id="who"></div></div>
  <nav id="nav"></nav>
  <main class="wrap" id="view"></main>
</div>

<div id="sheetBg"></div><div id="sheet" role="dialog" aria-modal="true"></div><div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Public values only (publishable key; Row Level Security protects the data)
window.STOCK_CONFIG = {
  url: "https://uwiuzlfnhdtroozcilhi.supabase.co",
  key: "sb_publishable_4n2qVWgpdypWRx902UMung_2WVq5vxD",
};
const sb = supabase.createClient(STOCK_CONFIG.url, STOCK_CONFIG.key);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('th-TH', {maximumFractionDigits: 2});
const fdt = s => new Date(s).toLocaleString('th-TH', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Bangkok'});
const fday = s => new Date(s).toLocaleDateString('th-TH', {day:'numeric', month:'short', timeZone:'Asia/Bangkok'});
const TYPE = {OUT:'เบิก', IN:'รับเข้า', ADJUST:'ปรับยอด', NEW:'เพิ่มสินค้า'};
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  home: svg('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  out: svg('<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>'),
  in: svg('<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>'),
  box: svg('<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>'),
  more: svg('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
  check: svg('<circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/>'),
};
const NAV = [['home','หน้าหลัก',IC.home],['out','เบิกของ',IC.out],['in','รับของเข้า',IC.in],['stock','สต็อก',IC.box],['more','เพิ่มเติม',IC.more]];
const NAV_OF = {hist:'more', sum:'more', users:'more'};

let me = null, items = [], mode = 'in';
const cart = { OUT: {who:'', note:'', lines:[]}, IN: {who:'', note:'', lines:[]} };

function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2600); }
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheetBg').style.display = $('#sheet').style.display = 'block'; $('#sheet').classList.add('open'); }
function closeSheet() { $('#sheetBg').style.display = $('#sheet').style.display = 'none'; $('#sheet').classList.remove('open'); }
$('#sheetBg').onclick = closeSheet;
document.addEventListener('keydown', e => e.key === 'Escape' && closeSheet());

/* ---------- login ---------- */
const RECOVERY = location.hash.includes('type=recovery');
function setMode(m) { mode = m; const up = m === 'up';
  $('#lTitle').textContent = up ? 'สมัครใช้งาน' : 'เข้าสู่ระบบ'; $('#nameBox').classList.toggle('hide', !up); $('#forgot').parentElement.classList.toggle('hide', up);
  $('#go').textContent = up ? 'สมัครใช้งาน' : 'เข้าสู่ระบบ'; $('#swText').textContent = up ? 'มีบัญชีแล้ว?' : 'ยังไม่มีบัญชี?'; $('#swBtn').textContent = up ? 'เข้าสู่ระบบ' : 'สมัครใช้งาน';
  $('#pw').autocomplete = up ? 'new-password' : 'current-password'; $('#loginMsg').innerHTML = ''; }
$('#swBtn').onclick = () => setMode(mode === 'in' ? 'up' : 'in');
$('#eye').onclick = () => { const i = $('#pw'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; $('#eye').setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'); };
const authMsg = m => /rate limit/i.test(m) ? 'ระบบส่งอีเมลบ่อยเกินไป รอสักครู่แล้วลองใหม่ หรือแจ้งผู้ดูแล' : m === 'Invalid login credentials' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : m;
$('#go').onclick = async () => {
  const email = $('#em').value.trim(), password = $('#pw').value, name = $('#nm').value.trim();
  const say = (k, t) => $('#loginMsg').innerHTML = `<div class="note ${k}">${esc(t)}</div>`;

function itemSheet(it) {
  const admin = me.role === 'admin', n = !it;
  if (!admin) return openSheet(`<h1>${esc(it.name)}</h1><p class="sub">${esc(it.code)} · ${esc(it.category)}</p><div class="card" style="margin:16px 0"><span class="num" style="font-size:32px">${fmt(it.qty)}</span> ${esc(it.unit)}<p class="sub">จุดสั่งซื้อขั้นต่ำ ${fmt(it.min_qty)}${it.last_out ? ' · เบิกล่าสุด ' + fday(it.last_out) : ''}</p></div><button class="btn ghost" onclick="closeSheet()">ปิด</button>`);
  it ||= {code:'', name:'', qty:0, unit:'', min_qty:0, category:''};
  openSheet(`<h1>${n ? 'เพิ่มสินค้าใหม่' : esc(it.name)}</h1>${n ? '' : `<p class="sub">${esc(it.code)} · ${esc(it.category)}</p>`}
    <div class="form" style="margin-top:14px">
      ${n ? `<label>รหัสสินค้า<input id="code" placeholder="เช่น A-043"></label>` : `<div class="card"><label>นับของแล้วเหลือเท่าไร (ตอนนี้ ${fmt(it.qty)} ${esc(it.unit)})<input id="newq" type="number" inputmode="decimal" step="any" placeholder="ใส่จำนวนที่นับได้"></label>
        <label style="margin-top:10px">เหตุผลที่ปรับ<input id="why" placeholder="เช่น นับสต็อกประจำเดือน"></label></div>`}
      <label>ชื่อสินค้า<input id="name" value="${esc(it.name)}"></label>
      <div class="two"><label>หน่วย<input id="unit" value="${esc(it.unit)}" placeholder="แพ็ค, ชิ้น"></label><label>เตือนเมื่อเหลือไม่เกิน<input id="min" type="number" inputmode="decimal" step="any" value="${it.min_qty}"></label></div>
      <label>หมวดหมู่<input id="cat" value="${esc(it.category)}" list="cats"></label><datalist id="cats">${[...new Set(items.map(i => i.category))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      ${n ? `<label>จำนวนเริ่มต้น<input id="qty" type="number" inputmode="decimal" step="any" value="0"></label>` : ''}
      <div id="msg"></div><button class="btn" id="save">บันทึก</button><button class="btn ghost" id="cancel">ยกเลิก</button></div>`);
  $('#cancel').onclick = closeSheet;
  $('#save').onclick = async () => {
    const say = (k, t) => $('#msg').innerHTML = `<div class="note ${k}">${esc(t)}</div>`;
    const row = { name: $('#name').value.trim(), unit: $('#unit').value.trim(), min_qty: +$('#min').value || 0, category: $('#cat').value.trim() };
    if (!row.name) return say('bad', 'กรอกชื่อสินค้า');
    $('#save').disabled = true; let r;
    if (n) { const code = $('#code').value.trim(); if (!code) { $('#save').disabled = false; return say('bad', 'กรอกรหัสสินค้า'); }
      r = await sb.from('items').insert({ ...row, code, qty: 0 });
      if (!r.error) { await sb.from('movements').insert({ type:'NEW', code, qty: 0, actor: me.display_name, dept: row.category, note:'เพิ่มสินค้าใหม่' });
        const q0 = +$('#qty').value || 0; if (q0 > 0) r = await sb.rpc('set_stock', { p_code: code, p_new_qty: q0, p_note: 'ยอดเริ่มต้น' }); } }
    else { r = await sb.from('items').update({ ...row, updated_at: new Date().toISOString() }).eq('code', it.code);
      const nq = $('#newq').value; if (!r.error && nq !== '') { if (!$('#why').value.trim()) { $('#save').disabled = false; return say('bad', 'บอกเหตุผลที่ปรับยอดด้วย'); }
        r = await sb.rpc('set_stock', { p_code: it.code, p_new_qty: +nq, p_note: $('#why').value.trim() }); } }
    if (r.error) { $('#save').disabled = false; return say('bad', r.error.message); }
    toast('บันทึกแล้ว'); route();
  };
}

/* ---------- more ---------- */
async function more() {
  const admin = me.role === 'admin';
  const link = (t, s, to) => `<button class="pick" data-g="${to}"><div style="flex:1"><div class="t" style="font-weight:500">${t}</div><div class="sub" style="font-size:14px">${s}</div></div><span class="sub">›</span></button>`;
  $('#view').innerHTML = `<h1>เพิ่มเติม</h1><div class="card" style="margin-top:14px">${link('ประวัติ', 'ดูรายการเบิก รับ ปรับยอดทั้งหมด', 'hist')}${link('สรุปรายเดือน', 'ดูว่าเดือนนี้เบิกอะไรไปบ้าง', 'sum')}${admin ? link('ผู้ใช้งาน', 'อนุมัติและจัดการผู้ใช้', 'users') : ''}</div>
    <div class="card form" style="margin-top:14px"><label>เปลี่ยนรหัสผ่าน<input id="np" type="password" autocomplete="new-password" placeholder="รหัสผ่านใหม่ อย่างน้อย 6 ตัวอักษร"></label><button class="btn soft" id="chpw">บันทึกรหัสผ่านใหม่</button></div>
    <div class="stack" style="margin-top:18px"><p class="sub">เข้าสู่ระบบเป็น ${esc(me.display_name)} (${admin ? 'ผู้ดูแล' : 'พนักงาน'})</p><button class="btn ghost" id="lo">ออกจากระบบ</button></div>`;
  $('#chpw').onclick = async () => { const v = $('#np').value; if (v.length < 6) return toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
    const { error } = await sb.auth.updateUser({ password: v }); if (error) return toast(error.message); $('#np').value = ''; toast('เปลี่ยนรหัสผ่านแล้ว'); };
  $('#lo').onclick = logout; $('#view').onclick = e => { const b = e.target.closest('[data-g]'); if (b) go(b.dataset.g); };
}

/* ---------- history ---------- */
async function hist() {
  let type = '', text = '', rows = [];
  $('#view').innerHTML = `<h1>ประวัติ</h1><div class="search" style="margin-top:12px">${IC.search}<input id="f" placeholder="ค้นหาสินค้า หรือชื่อคน" autocomplete="off"></div>
    <div class="chips" id="chips" style="margin-top:10px">${[['','ทั้งหมด'],['OUT','เบิก'],['IN','รับเข้า'],['ADJUST','ปรับยอด']].map(c => `<button class="chip ${c[0]===''?'on':''}" data-t="${c[0]}">${c[1]}</button>`).join('')}</div>
    <div class="card" id="list"></div><div class="stack" style="margin-top:12px"><button class="btn soft" id="csv">ดาวน์โหลดเป็นไฟล์ Excel (CSV)</button></div>`;
  const draw = () => { const t = text.toLowerCase(); const v = rows.filter(m => !t || `${m.code} ${m.items?.name} ${m.note} ${m.actor}`.toLowerCase().includes(t));
    $('#list').innerHTML = v.slice(0, 120).map(moveRow).join('') || '<p class="empty">ไม่พบรายการ</p>' + (v.length > 120 ? `<p class="sub" style="text-align:center">แสดง 120 จาก ${v.length} รายการ ใช้ค้นหาเพื่อกรอง</p>` : ''); };
  const load = async () => { let q = sb.from('movements').select('*, items(name,unit)').order('ts', {ascending:false}).limit(600); if (type) q = q.eq('type', type);
    const { data, error } = await q; if (error) return $('#list').innerHTML = `<div class="note bad">${esc(error.message)}</div>`; rows = data; draw(); };
  $('#f').oninput = e => { text = e.target.value.trim(); draw(); };
  $('#chips').onclick = e => { const b = e.target.closest('button'); if (!b) return; type = b.dataset.t; document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c === b)); load(); };
  $('#csv').onclick = () => download('ประวัติ.csv', [['เวลา','ประเภท','รหัส','รายการ','จำนวน','คงเหลือ','ผู้บันทึก','หมวด','ผู้เบิก/หมายเหตุ'], ...rows.map(m => [fdt(m.ts), TYPE[m.type], m.code, m.items?.name, m.qty, m.balance_after, m.actor, m.dept, m.note])]);
  load();
}
function download(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], {type:'text/csv'})), download: name }).click();
}

/* ---------- summary ---------- */
async function sum() {
  const { data, error } = await sb.from('v_monthly_by_item').select('*'); if (error) throw error;
  const months = [...new Set(data.map(d => d.month))].sort().reverse();
  if (!months.length) return $('#view').innerHTML = '<h1>สรุปรายเดือน</h1><p class="empty">ยังไม่มีข้อมูล</p>';
  const mname = m => new Date(m + '-01T12:00:00+07:00').toLocaleDateString('th-TH', {month:'long', year:'numeric'});
  let cur = months[0], rows = [];
  $('#view').innerHTML = `<h1>สรุปรายเดือน</h1><div class="chips" id="chips" style="margin-top:12px">${months.map(m => `<button class="chip" data-m="${m}">${mname(m)}</button>`).join('')}</div><div id="out"></div>`;
  const draw = () => {
    document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', c.dataset.m === cur));
    rows = data.filter(d => d.month === cur).sort((a, b) => b.out_qty - a.out_qty);
    const to = rows.reduce((s, r) => s + +r.out_qty, 0), ti = rows.reduce((s, r) => s + +r.in_qty, 0), top = rows.filter(r => +r.out_qty > 0).slice(0, 10), mx = Math.max(1, ...top.map(r => +r.out_qty));
    const cat = {}; rows.forEach(r => cat[r.category] = (cat[r.category] || 0) + +r.out_qty); const cats = Object.entries(cat).filter(c => c[1] > 0).sort((a, b) => b[1] - a[1]); const cm = Math.max(1, ...cats.map(c => c[1]));
    const bar = (label, sub, v, m, col) => `<div style="padding:8px 0"><div style="display:flex;justify-content:space-between;gap:10px"><span class="t">${esc(label)}</span><span class="num">${fmt(v)} <span class="sub" style="font-size:13px">${esc(sub)}</span></span></div><div style="height:8px;border-radius:9px;background:var(--line);margin-top:5px"><div style="height:8px;border-radius:9px;background:${col};width:${v / m * 100}%"></div></div></div>`;
    $('#out').innerHTML = `<div class="facts"><div class="card fact"><span class="num" style="color:var(--rose)">${fmt(to)}</span><span>เบิกออก (ชิ้น)</span></div><div class="card fact"><span class="num" style="color:var(--sage)">${fmt(ti)}</span><span>รับเข้า (ชิ้น)</span></div></div>
      <h2>เบิกมากที่สุด</h2><div class="card">${top.map(r => bar(r.name, r.unit, +r.out_qty, mx, 'var(--rose)')).join('') || '<p class="empty">เดือนนี้ยังไม่มีการเบิก</p>'}</div>
      <h2>แยกตามหมวด</h2><div class="card">${cats.map(c => bar(c[0], 'ชิ้น', c[1], cm, 'var(--sage)')).join('') || '<p class="empty">ไม่มีข้อมูล</p>'}</div>
      <div class="stack" style="margin-top:14px"><button class="btn soft" id="csv">ดาวน์โหลดเป็นไฟล์ Excel (CSV)</button></div>`;
    $('#csv').onclick = () => download(`สรุป-${cur}.csv`, [['รหัส','ชื่อ','หมวด','เบิก','รับ','หน่วย'], ...rows.map(r => [r.code, r.name, r.category, r.out_qty, r.in_qty, r.unit])]); };
  $('#chips').onclick = e => { const b = e.target.closest('button'); if (b) { cur = b.dataset.m; draw(); } };
  draw();
}

/* ---------- users (admin) ---------- */
async function users() {
  if (me.role !== 'admin') return go('home');
  const { data, error } = await sb.from('profiles').select('*').order('created_at'); if (error) throw error;
  $('#view').innerHTML = `<h1>ผู้ใช้งาน</h1><p class="sub">คนที่สมัครใหม่จะใช้งานได้หลังคุณกดอนุมัติ</p><div class="card" style="margin-top:14px">${data.map(u => `<div class="row"><div class="grow"><div class="t">${esc(u.display_name)}</div><div class="s">${esc(u.email)} · ${u.role === 'admin' ? 'ผู้ดูแล' : 'พนักงาน'}</div></div>
    ${u.id === me.id ? '<span class="pill ok">คุณ</span>' : `<button class="btn sm ${u.active ? 'ghost' : ''}" data-a="${u.id}" data-v="${!u.active}">${u.active ? 'ระงับ' : 'อนุมัติ'}</button>`}</div>`).join('')}</div>`;
  $('#view').onclick = async e => { const b = e.target.closest('[data-a]'); if (!b) return;
    const { error } = await sb.from('profiles').update({ active: b.dataset.v === 'true' }).eq('id', b.dataset.a);
    if (error) toast(error.message); else { toast(b.dataset.v === 'true' ? 'อนุมัติแล้ว' : 'ระงับแล้ว'); users(); } };
}

boot();
</script>
